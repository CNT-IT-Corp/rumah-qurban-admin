on:
  push:
    branches:
      - main

jobs:
  force-owner-commit:
    if: "!contains(github.event.head_commit.message, 'trigger vercel build')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.OWNER_TOKEN }}

      - name: Set git identity (owner)
        run: |
          git config user.name "devcntid"
          git config user.email "dev@cnt.id"

      - name: Update VERSION
        run: |
          date '+%Y-%m-%d %H:%M:%S' > VERSION

      - name: Commit change
        run: |
          git add VERSION

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "trigger vercel build"

      - name: Push commit
        run: |
          git push